# Runs the docreview checks with the Go version from docreview/go.mod.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docreview:
    name: docreview tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docreview
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: docreview/go.mod
          cache: false

      - run: go vet ./...
      - run: go test -race ./...
